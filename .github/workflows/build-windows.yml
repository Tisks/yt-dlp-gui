name: Build Windows installer

# macOS is built locally with packaging/macos/release.sh + make_dmg.sh.
# Windows is built here because PyInstaller cannot cross-compile.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Ensure Inno Setup is available
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          echo "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Run tests
        # Gates the installer: a failing suite must not produce a downloadable
        # .exe. Exercises the Windows branches on an actual Windows runner,
        # which is the only place they run for real.
        #
        # -X utf8 forces UTF-8 stdio: piped/redirected output on Windows
        # otherwise defaults to the legacy ANSI codepage (cp1252), which
        # can't encode the ✓/✗/✕ glyphs the tests print.
        run: python -X utf8 tests\run_tests.py

      - name: Check extension config is in sync with config.py
        run: python scripts\generate_extension_config.py --check

      - name: Fetch vendored tools (yt-dlp, ffmpeg, ffprobe, deno)
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\fetch_vendor.ps1

      - name: Resolve version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "0.0.${{ github.run_number }}"
          }
          echo "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Build app and installer
        run: >
          powershell -ExecutionPolicy Bypass -File packaging\windows\release.ps1
          -Version ${{ steps.version.outputs.value }} -SkipVendor

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-windows-installer
          path: dist/windows/*-setup.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows/*-setup.exe
